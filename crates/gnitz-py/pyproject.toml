[build-system]
requires      = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name             = "gnitz"
version          = "0.1.0"
requires-python  = ">=3.14"
classifiers      = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "maturin>=1.0,<2.0",
    "jupyterlab>=4.0",
]

[tool.pytest.ini_options]
xfail_strict = true
# A server data dir holds a fallocated SAL, so the defaults (keep 3 sessions,
# keep every test's dir) are unaffordable. "failed" makes the tmp_path teardown
# drop a passing test's dir at end of test, which is what bounds a green run's
# peak; a failing test keeps its dir, which is what makes a red run debuggable.
tmp_path_retention_count  = 1
tmp_path_retention_policy = "failed"

[tool.maturin]
features       = ["pyo3/extension-module"]
module-name    = "gnitz._native"
python-source  = "python"
