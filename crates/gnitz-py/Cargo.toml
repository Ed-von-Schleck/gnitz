[package]
name    = "gnitz-py"
version = "0.1.0"
edition = "2021"

[lib]
name       = "gnitz"
crate-type = ["cdylib"]

[features]
default     = []

[dependencies]
pyo3           = { version = "0.23", features = ["extension-module", "abi3-py310"] }
gnitz-core     = { path = "../gnitz-core" }
gnitz-expr     = { path = "../gnitz-expr" }
gnitz-sql      = { path = "../gnitz-sql" }
gnitz-wire     = { path = "../gnitz-wire" }
