[package]
name = "gnitz-wire"
description = "Wire-protocol constants, codecs and the circuit graph shared by gnitz clients and the gnitz engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# `gnitz_wire::fields`: the field map of what a decode read, for the fuzzer.
field-map = []

[dependencies]
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# A key list short enough to need no heap.
smallvec.workspace = true

[dev-dependencies]
# The benches' instruction and cycle counters.
gnitz-foundation = { path = "../gnitz-foundation" }

[lints]
workspace = true
