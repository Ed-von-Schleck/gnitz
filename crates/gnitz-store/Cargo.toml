[package]
name = "gnitz-store"
version = "0.1.0"
edition = "2021"

[dependencies]
gnitz-foundation = { path = "../gnitz-foundation" }
gnitz-wire = { path = "../gnitz-wire" }
gnitz-expr = { path = "../gnitz-expr" }
gnitz-zset = { path = "../gnitz-zset" }
libc.workspace = true
io-uring.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
gnitz-zset-testkit = { path = "../gnitz-zset-testkit" }
tempfile.workspace = true
proptest.workspace = true

# Spelled out rather than `workspace = true`, which cannot be extended: this
# crate publishes an API across the engine seam, so it also wants
# `unreachable_pub` — allow-by-default, so `warnings = "deny"` does not imply it
# — to make an over-wide `pub` inside a private module a compile error.
[lints.rust]
warnings = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
