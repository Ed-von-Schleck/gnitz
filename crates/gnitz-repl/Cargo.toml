[package]
name = "gnitz-repl"
description = "Interactive SQL shell for the gnitz database"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "gnitz"
path = "src/main.rs"

[features]
integration = []

[dependencies]
gnitz-core.workspace = true
gnitz-expr.workspace = true
gnitz-sql = { path = "../gnitz-sql" }
gnitz-wire.workspace = true
reedline = "0.52"
nu-ansi-term = "0.50"
comfy-table = { version = "8", features = ["custom_styling"] }
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
serde_json = "1"
dirs = "7"
signal-hook = "0.3"
crossterm = "0.29"
libc.workspace = true
tempfile.workspace = true

[dev-dependencies]
gnitz-test-harness = { path = "../gnitz-test-harness" }

[lints]
workspace = true
