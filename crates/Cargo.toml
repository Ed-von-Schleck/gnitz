[workspace]
resolver = "2"
members = [
    "gnitz-foundation",
    "gnitz-wire",
    "gnitz-expr",
    "gnitz-core",
    "gnitz-sql",
    "gnitz-tokio",
    "gnitz-py",
    "gnitz-store",
    "gnitz-zset",
    "gnitz-mirror",
    "gnitz-server",
    "gnitz-zset-testkit",
    "gnitz-test-harness",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
authors = ["Christian Schramm"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ed-von-Schleck/gnitz"
readme = "../README.md"
keywords = ["database", "sql", "dbsp", "incremental", "materialized-views"]
categories = ["database-implementations"]

# One lint policy for the workspace, taken by every crate with
# `[lints] workspace = true`. `gnitz-zset` and `gnitz-store` are the exceptions:
# each spells its own table out so it can add `unreachable_pub`, which cargo does
# not let a crate layer on top of the shared one.
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# One version per third-party crate used by more than one member, so a bump is
# one edit rather than an N-file sweep that can be done partially with no
# diagnostic. Single-consumer dependencies stay in the crate that has them.
[workspace.dependencies]
io-uring = "0.7"
libc = "0.2"
proptest = "1"
rustc-hash = "2"
tempfile = "3"
# `default-features = false` pins the ring backend: the default is aws-lc-rs,
# which needs a C/cmake toolchain and would break the "no C++ toolchain"
# promise. rcgen's "pem" is required for `Certificate::pem()`.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# The workspace's own crates, as the published ones depend on each other. The
# pin is exact: client and engine must agree on the wire protocol, so a release
# resolves only against its own siblings. Bump these with `version` above.
gnitz-foundation = { path = "gnitz-foundation", version = "=0.1.2" }
gnitz-wire = { path = "gnitz-wire", version = "=0.1.2" }
gnitz-expr = { path = "gnitz-expr", version = "=0.1.2" }
gnitz-core = { path = "gnitz-core", version = "=0.1.2" }
gnitz-zset = { path = "gnitz-zset", version = "=0.1.2" }
gnitz-store = { path = "gnitz-store", version = "=0.1.2" }

# Release: panic aborts the process so reactor-task panics surface as a
# backtrace on stderr instead of being silently dropped.  Dev keeps unwind
# so `#[should_panic]` tests can observe them.
[profile.release]
panic = "abort"
# Fat LTO so hot paths inline across crate/module boundaries — e.g. the
# `repr::scatter` kernels calling `DirectWriter` in a sibling module, and the
# operators calling into the batch. Those all live inside `gnitz-zset`; what LTO
# adds on top is the seams above it — the store's and the server's — where it
# buys per-key, per-request and per-frame work, not per-row: the row kernels run
# below those seams, driven by one call per batch or per run. What crosses is a
# store's point lookup into its runs, the row accessors unique-PK enforcement
# and write validation read a pushed batch through, batch/send-buffer drop glue
# and the catalog and DAG accessors, so trimming this costs a call per probed
# run, per frame and per request, and per row only of a pushed batch.
lto = true

[profile.release-checked]
# Release codegen with the Z-set layout verifiers left in. `[profile.release]`
# is the only configuration the LTO'd, vectorised batch kernels ever run in, and
# it is also the one where `certify_consolidated` degrades to a bare field store
# — so a kernel that over-claims it corrupts weights silently with nothing to
# catch it. This profile reunites the two: reach for it when a
# batch kernel changed or a bug reproduces only in release. Never the inner
# loop, and never benchmarked — the verifiers are an O(n) pass per batch.
inherits = "release"
debug-assertions = true
# Independent of `debug-assertions`, and deliberately off: overflow-checks turn
# a wrapping add into a panic, which is a different claim than "this batch is
# consolidated as it says". Keeping it off leaves an abort here unambiguous.
overflow-checks = false

[profile.dev]
panic = "unwind"

# The E2E suite runs the debug server, and at opt-level 0 LLVM runs no inliner,
# so every small per-row helper in the expression kernels stays a real call.
# Optimizing this one crate lets those kernels be written as ordinary Rust
# instead of annotating each helper `#[inline(always)]`. `debug-assertions` and
# `overflow-checks` are independent of `opt-level` and stay on.
#
# It does not reach across the crate boundary: `ColumnLocator` is called per row
# from gnitz-zset, which is still opt-level 0, so its methods keep their
# `#[inline(always)]`.
[profile.dev.package.gnitz-expr]
opt-level = 1
