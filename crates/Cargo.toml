[workspace]
resolver = "2"
members = [
    "gnitz-wire",
    "gnitz-expr",
    "gnitz-core",
    "gnitz-sql",
    "gnitz-capi",
    "gnitz-py",
    "gnitz-engine",
    "gnitz-server",
    "gnitz-engine-testkit",
    "gnitz-test-harness",
]

# Release: panic aborts the process so reactor-task panics surface as a
# backtrace on stderr instead of being silently dropped.  Dev keeps unwind
# so `#[should_panic]` tests can observe them.
[profile.release]
panic = "abort"
# Fat LTO so hot paths inline across crate/module boundaries — e.g. the
# `repr::scatter` kernels calling `DirectWriter` in a sibling module, and the
# operator layer calling into storage. Since `runtime` moved to `gnitz-server`
# it also spans the engine/server seam, where what it buys is per-request and
# per-frame, not per-row: the row kernels run inside the engine, driven by one
# call per batch. What crosses is batch/send-buffer drop glue and the catalog
# and DAG accessors, so trimming this costs a call per frame and per request,
# not per row.
lto = true

[profile.dev]
panic = "unwind"

# The E2E suite runs the debug server, and at opt-level 0 LLVM runs no inliner,
# so every small per-row helper in the expression kernels stays a real call.
# Optimizing this one crate lets those kernels be written as ordinary Rust
# instead of annotating each helper `#[inline(always)]`. `debug-assertions` and
# `overflow-checks` are independent of `opt-level` and stay on.
#
# It does not reach across the crate boundary: `ColumnLocator` and `MorselOut`
# are called per row from gnitz-engine, which is still opt-level 0, so those
# methods keep their `#[inline(always)]`.
[profile.dev.package.gnitz-expr]
opt-level = 1
