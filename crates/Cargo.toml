[workspace]
resolver = "2"
members = [
    "gnitz-foundation",
    "gnitz-wire",
    "gnitz-expr",
    "gnitz-core",
    "gnitz-sql",
    "gnitz-tokio",
    "gnitz-py",
    "gnitz-store",
    "gnitz-mirror",
    "gnitz-server",
    "gnitz-store-testkit",
    "gnitz-test-harness",
]

# One lint policy for the workspace, taken by every crate with
# `[lints] workspace = true`. `gnitz-store` is the exception: it spells its own
# table out so it can add `unreachable_pub`, which cargo does not let a crate
# layer on top of the shared one.
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# One version per third-party crate used by more than one member, so a bump is
# one edit rather than an N-file sweep that can be done partially with no
# diagnostic. Single-consumer dependencies stay in the crate that has them.
[workspace.dependencies]
io-uring = "0.7"
libc = "0.2"
proptest = "1"
rustc-hash = "2"
tempfile = "3"
# `default-features = false` pins the ring backend: the default is aws-lc-rs,
# which needs a C/cmake toolchain and would break the "no C++ toolchain"
# promise. rcgen's "pem" is required for `Certificate::pem()`.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# Release: panic aborts the process so reactor-task panics surface as a
# backtrace on stderr instead of being silently dropped.  Dev keeps unwind
# so `#[should_panic]` tests can observe them.
[profile.release]
panic = "abort"
# Fat LTO so hot paths inline across crate/module boundaries — e.g. the
# `repr::scatter` kernels calling `DirectWriter` in a sibling module, and the
# operator layer calling into storage. Those all live inside `gnitz-store`; what
# LTO adds on top is the store/engine and engine/server seams, where it buys
# per-request and per-frame work, not per-row: the row kernels run below both
# seams, driven by one call per batch. What crosses is batch/send-buffer drop
# glue and the catalog and DAG accessors, so trimming this costs a call per
# frame and per request, not per row.
lto = true

[profile.release-checked]
# Release codegen with the Z-set layout verifiers left in. `[profile.release]`
# is the only configuration the LTO'd, vectorised batch kernels ever run in, and
# it is also the one where `certify_layout` degrades to a bare field store — so
# a kernel that over-claims `Sorted`/`Consolidated` corrupts weights silently
# with nothing to catch it. This profile reunites the two: reach for it when a
# batch kernel changed or a bug reproduces only in release. Never the inner
# loop, and never benchmarked — the verifiers are an O(n) pass per batch.
inherits = "release"
debug-assertions = true
# Independent of `debug-assertions`, and deliberately off: overflow-checks turn
# a wrapping add into a panic, which is a different claim than "this batch is
# laid out as its tag says". Keeping it off leaves an abort here unambiguous.
overflow-checks = false

[profile.dev]
panic = "unwind"

# The E2E suite runs the debug server, and at opt-level 0 LLVM runs no inliner,
# so every small per-row helper in the expression kernels stays a real call.
# Optimizing this one crate lets those kernels be written as ordinary Rust
# instead of annotating each helper `#[inline(always)]`. `debug-assertions` and
# `overflow-checks` are independent of `opt-level` and stay on.
#
# It does not reach across the crate boundary: `ColumnLocator` and `MorselOut`
# are called per row from gnitz-store, which is still opt-level 0, so those
# methods keep their `#[inline(always)]`.
[profile.dev.package.gnitz-expr]
opt-level = 1
