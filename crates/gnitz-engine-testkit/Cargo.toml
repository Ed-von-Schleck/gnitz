[package]
name = "gnitz-engine-testkit"
version = "0.1.0"
edition = "2021"

[dependencies]
gnitz-engine = { path = "../gnitz-engine" }
gnitz-wire   = { path = "../gnitz-wire" }
# A normal dependency, not a dev one: `arb_type_code` returns `impl Strategy` in
# its public signature, so both consumers must resolve the same proptest.
proptest = "1"
libc = "0.2"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
