[package]
name    = "gnitz-expr"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
gnitz-wire = { path = "../gnitz-wire" }
# The substring scan.
# `no_std` and itself dependency-free, so it pulls nothing into this leaf crate.
memchr = "2.8.3"
# The vector types under the mask kernels, and their run-time dispatch.
# Dependency-free.
fearless_simd = "1.0"

[dev-dependencies]
# The benches' shared pass-count knob.
gnitz-foundation = { path = "../gnitz-foundation" }

[lints]
workspace = true
