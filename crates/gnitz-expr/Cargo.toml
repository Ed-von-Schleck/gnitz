[package]
name    = "gnitz-expr"
version = "0.1.0"
edition = "2021"

[dependencies]
gnitz-wire = { path = "../gnitz-wire" }
# The substring scan behind LIKE's `%x%`, STRPOS, REPLACE and SPLIT_PART.
# `no_std` and itself dependency-free, so it pulls nothing into this leaf crate.
memchr = "2"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
