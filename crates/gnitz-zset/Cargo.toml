[package]
name = "gnitz-zset"
description = "The Z-set kernel of the gnitz database: schema, columnar batches, cursors and operators"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
gnitz-foundation.workspace = true
gnitz-wire.workspace = true
gnitz-expr.workspace = true
xorf = { version = "0.13", default-features = false, features = ["binary-fuse"] }
rustc-hash.workspace = true
# `O_TMPFILE`, for the spill sort's nameless run file.
libc.workspace = true
# The UTF-8 check on a pushed block's STRING cells.
simdutf8 = "0.1"

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true

# Spelled out rather than `workspace = true`, which cannot be extended: this
# crate publishes an API to the store and the server above it, so it also wants
# `unreachable_pub` — allow-by-default, so `warnings = "deny"` does not imply it
# — to make an over-wide `pub` inside a private module a compile error.
[lints.rust]
warnings = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
