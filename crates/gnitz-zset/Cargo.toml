[package]
name = "gnitz-zset"
description = "The Z-set kernel of the gnitz database: schema, columnar batches, cursors and operators"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
gnitz-foundation.workspace = true
gnitz-wire.workspace = true
gnitz-expr.workspace = true
xorf = { version = "0.13", default-features = false, features = ["binary-fuse"] }
rustc-hash.workspace = true
# `mmap`, for the read-only file mapping.
libc.workspace = true
# The UTF-8 check on a pushed block's STRING cells.
simdutf8 = "0.1"
fsst-rs = "0.7"
# Inline storage for the per-materialize index tables of `repr::scatter`.
smallvec.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true

[lints]
workspace = true
