[package]
name = "gnitz-tokio"
description = "Async Rust client for the gnitz database, on tokio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
integration = []

[dependencies]
gnitz-core.workspace = true
gnitz-wire.workspace = true
# `net` brings `AsyncFd`, `rt` the runtime context it must be built inside plus
# `spawn_blocking`, and `sync` the mpsc and the oneshot the handle and
# driver share.
tokio = { version = "1", default-features = false, features = ["net", "rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
gnitz-test-harness = { path = "../gnitz-test-harness" }
# The store the mirroring integration test attaches. A dev-dependency, so the
# crate itself stays engine-free — which is the whole point of taking an opened
# store rather than a directory.
gnitz-mirror = { path = "../gnitz-mirror" }
libc.workspace = true
tempfile.workspace = true

[lints]
workspace = true
