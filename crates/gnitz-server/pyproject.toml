# The server binary as a Python package, `gnitz-server`, which `gnitz[server]`
# installs beside the client: what `gnitz.local_server` and the `gnitz` shell
# run for development and tests. A wheel carries the binary alone.
[build-system]
requires      = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name             = "gnitz-server"
dynamic          = ["version"]
description      = "The gnitz server, a SQL database whose views are all materialized and incrementally updated"
readme           = "README.md"
requires-python  = ">=3.9"
license          = "MIT OR Apache-2.0"
license-files    = ["LICENSE-APACHE", "LICENSE-MIT"]
authors          = [{ name = "Christian Schramm" }]
keywords         = ["database", "sql", "dbsp", "incremental", "materialized-views"]
classifiers      = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Database :: Database Engines/Servers",
]

[project.urls]
Repository = "https://github.com/Ed-von-Schleck/gnitz"

[tool.maturin]
bindings = "bin"
