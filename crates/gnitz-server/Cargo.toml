[package]
name = "gnitz-server"
description = "The gnitz database server: SQL with incrementally maintained materialized views, implementing DBSP"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "gnitz-server"
path = "src/main.rs"

# The release archive: the server runs on Linux only, and ships with the
# seccomp profile a container runs it under and the systemd unit a host does.
[package.metadata.dist]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
include = ["../../container/seccomp.json", "../../packaging/gnitz-server.service"]

[dependencies]
gnitz-foundation.workspace = true
gnitz-store.workspace = true
gnitz-zset.workspace = true
gnitz-wire.workspace = true
gnitz-expr.workspace = true
libc.workspace = true
io-uring.workspace = true
rustc-hash.workspace = true
rustls.workspace = true
rcgen.workspace = true
# The access tokens' SHA-256 and the CSPRNG that mints them: the crypto
# provider rustls and rcgen already run on.
ring = "0.17"
# The reactor's task and op tables, keyed by slots reused once freed.
slab = "0.4"

[dev-dependencies]
# Dev-only, and deliberately not a real dependency: the client half of the
# DDL-bundle client→server pairing and of the layout-digest agreement (the
# schema-codec suite).
gnitz-core = { path = "../gnitz-core" }
gnitz-zset-testkit = { path = "../gnitz-zset-testkit" }
# The in-process fuzz targets: inputs and seeds are the session fuzzer's, and
# `cargo bolero` runs a target under libFuzzer.
gnitz-fuzz = { path = "../gnitz-fuzz" }
bolero = "0.13"
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
