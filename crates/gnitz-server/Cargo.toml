[package]
name = "gnitz-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gnitz-server"
path = "src/main.rs"

[dependencies]
gnitz-foundation = { path = "../gnitz-foundation" }
gnitz-store = { path = "../gnitz-store" }
gnitz-wire = { path = "../gnitz-wire" }
gnitz-expr = { path = "../gnitz-expr" }
libc.workspace = true
io-uring.workspace = true
rustc-hash.workspace = true
rustls.workspace = true
rcgen.workspace = true

[dev-dependencies]
# Dev-only, and deliberately not a real dependency: the client half of the
# DDL-bundle client→server pairing and of the layout-digest agreement (the
# schema-codec suite), and the client batches the executor tests push.
gnitz-core = { path = "../gnitz-core" }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
