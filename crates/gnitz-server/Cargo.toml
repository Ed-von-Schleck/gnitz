[package]
name = "gnitz-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gnitz-server"
path = "src/main.rs"

[dependencies]
gnitz-store  = { path = "../gnitz-store" }
gnitz-wire   = { path = "../gnitz-wire" }
gnitz-expr   = { path = "../gnitz-expr" }
libc = "0.2"
io-uring = "0.7"
rustc-hash = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# default-features = false pins the ring backend explicitly: rcgen's default
# crypto backend must NOT be aws-lc-rs (it needs a C/cmake toolchain and would
# break the "no C++ toolchain" promise). "pem" is required for Certificate::pem().
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[dev-dependencies]
# Dev-only, and deliberately not a real dependency: the schema-codec suite
# asserts the catalog's block encoder against the *client's*, which is the one
# thing on the far side of the wire this crate must agree with byte for byte.
gnitz-core = { path = "../gnitz-core" }
proptest = "1"
tempfile = "3"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
