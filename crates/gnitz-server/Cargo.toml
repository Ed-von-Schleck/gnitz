[package]
name = "gnitz-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gnitz-server"
path = "src/main.rs"

[dependencies]
gnitz-foundation = { path = "../gnitz-foundation" }
gnitz-store = { path = "../gnitz-store" }
gnitz-wire = { path = "../gnitz-wire" }
gnitz-expr = { path = "../gnitz-expr" }
libc.workspace = true
io-uring.workspace = true
rustc-hash.workspace = true
rustls.workspace = true
rcgen.workspace = true

[dev-dependencies]
# Dev-only, and deliberately not a real dependency: the schema-codec suite
# asserts the catalog's block encoder against the *client's*, which is the one
# thing on the far side of the wire this crate must agree with byte for byte.
gnitz-core = { path = "../gnitz-core" }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
