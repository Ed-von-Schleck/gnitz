[package]
name = "gnitz-server"
description = "The gnitz database server: SQL with incrementally maintained materialized views, implementing DBSP"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "gnitz-server"
path = "src/main.rs"

[dependencies]
gnitz-foundation.workspace = true
gnitz-store.workspace = true
gnitz-zset.workspace = true
gnitz-wire.workspace = true
gnitz-expr.workspace = true
libc.workspace = true
io-uring.workspace = true
rustc-hash.workspace = true
rustls.workspace = true
rcgen.workspace = true

[dev-dependencies]
# Dev-only, and deliberately not a real dependency: the client half of the
# DDL-bundle client→server pairing and of the layout-digest agreement (the
# schema-codec suite).
gnitz-core = { path = "../gnitz-core" }
gnitz-zset-testkit = { path = "../gnitz-zset-testkit" }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
