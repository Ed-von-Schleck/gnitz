[package]
name = "gnitz-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
gnitz-store = { path = "../gnitz-store" }
gnitz-wire  = { path = "../gnitz-wire" }
gnitz-expr  = { path = "../gnitz-expr" }
rustc-hash = "2"

[dev-dependencies]
libc = "0.2"
tempfile = "3"
proptest = "1"

[lints.rust]
warnings = "deny"
# Allow-by-default, so `warnings = "deny"` alone does not turn it on: this entry
# is what makes an over-wide `pub` inside a private module a compile error.
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
