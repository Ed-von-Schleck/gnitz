[package]
name = "gnitz"
description = "The SQL shell for gnitz, a database whose views are all materialized and incrementally maintained"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "database"]

# The library is the shell's parts, which its integration tests drive; named
# apart from the binary so the two build outputs do not collide.
[lib]
name = "gnitz_cli"

[[bin]]
name = "gnitz"
path = "src/main.rs"

[features]
integration = []

[dependencies]
gnitz-core.workspace = true
gnitz-expr.workspace = true
gnitz-sql.workspace = true
gnitz-dump.workspace = true
gnitz-wire.workspace = true
reedline = "0.53"
nu-ansi-term = "0.50"
comfy-table = "8"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
dirs = "7"
signal-hook = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
console = "0.16"
gnitz-foundation.workspace = true

[dev-dependencies]
gnitz-test-harness = { path = "../gnitz-test-harness" }
libc.workspace = true
tempfile.workspace = true

[lints]
workspace = true
